<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwinNames — Two of a Kind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    /* ── THEME TOKENS ──────────────────────────────────────────────────────── */
    .stage[data-theme="bright"] {
      --bg: #fffdf8; --ink: #2b2440; --muted: #8d85a3; --card: #ffffff;
      --c1: #ff4f87; --c2: #12bccb; --c3: #8a5cf0; --gold: #ffb524;
      --line: rgba(43,36,64,0.10); --soft: rgba(43,36,64,0.04);
      --blob1: rgba(255,79,135,0.16); --blob2: rgba(18,188,203,0.16); --blob3: rgba(138,92,240,0.14);
    }
    .stage[data-theme="pastel"] {
      --bg: #fdfbff; --ink: #4a4458; --muted: #a59fb4; --card: #ffffff;
      --c1: #ff9ab7; --c2: #71d4d4; --c3: #bda4ee; --gold: #ffd277;
      --line: rgba(74,68,88,0.09); --soft: rgba(74,68,88,0.035);
      --blob1: rgba(255,154,183,0.18); --blob2: rgba(113,212,212,0.18); --blob3: rgba(189,164,238,0.16);
    }
    .stage[data-theme="warm"] {
      --bg: #f1e7d6; --ink: #2d1f0e; --muted: #8b7355; --card: #faf6ef;
      --c1: #b5734e; --c2: #7d8a5b; --c3: #9c6f8e; --gold: #c79a3a;
      --line: rgba(92,74,42,0.18); --soft: rgba(92,74,42,0.05);
      --blob1: rgba(180,150,100,0.12); --blob2: rgba(125,138,91,0.10); --blob3: rgba(156,111,142,0.10);
    }

    body { font-family: 'Fredoka', system-ui, sans-serif; background: var(--bg, #fffdf8); }
    .stage { min-height: 100vh; background: var(--bg); position: relative; overflow-x: hidden; transition: background .3s; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    .bg-blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(420px 420px at 88% -4%, var(--blob1), transparent 70%),
        radial-gradient(380px 380px at -6% 18%, var(--blob2), transparent 70%),
        radial-gradient(460px 460px at 50% 112%, var(--blob3), transparent 72%);
    }
    .container { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }

    /* ── Masthead / logo ── */
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 26px; }
    .mast-spacer { width: 38px; flex: 0 0 auto; }
    .info-btn { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 50%; border: 1.5px solid var(--line);
      background: var(--card); color: var(--muted); font-weight: 700; font-style: italic; font-size: 1.05rem;
      font-family: 'DM Mono', monospace; box-shadow: 0 4px 12px var(--soft); transition: transform .15s, color .2s, border-color .2s; }
    .info-btn:hover { transform: translateY(-2px); color: var(--c2); border-color: var(--c2); }
    .logo { display: flex; align-items: center; gap: 11px; }
    .logo-tags { position: relative; width: 38px; height: 30px; }
    .logo-tags .tag { position: absolute; width: 26px; height: 26px; border-radius: 9px 9px 9px 2px; }
    .logo-tags .t1 { left: 0; top: 2px; background: var(--c1); transform: rotate(-8deg); }
    .logo-tags .t2 { right: 0; top: 0; background: var(--c2); transform: rotate(8deg); }
    .logo-word { font-weight: 700; font-size: 1.5rem; color: var(--ink); letter-spacing: -0.01em; }
    .logo-word span { color: var(--c1); }

    /* ── Panels ── */
    .config { display: flex; flex-direction: column; gap: 16px; }
    .panel { position: relative; background: var(--card); border: 1.5px solid var(--line);
      border-radius: 22px; padding: 22px 20px 20px; box-shadow: 0 8px 26px var(--soft); }
    .panel-icon { position: absolute; top: -15px; left: 22px; width: 34px; height: 34px;
      display: grid; place-items: center; font-size: 1rem; background: var(--card);
      border: 1.5px solid var(--line); border-radius: 11px; }

    /* segmented controls */
    .seg { display: inline-flex; gap: 8px; }
    .seg-btn { border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg);
      color: var(--muted); transition: transform .15s, background .2s, color .2s, border-color .2s, box-shadow .2s; }
    .seg-btn:active { transform: scale(0.95); }

    .big-seg { display: flex; gap: 12px; justify-content: center; width: 100%; }
    .count-btn { flex: 1; max-width: 220px; padding: 16px 10px; display: flex; flex-direction: column;
      align-items: center; gap: 6px; border-radius: 18px; }
    .count-babies { font-size: 1.5rem; line-height: 1; filter: grayscale(0.6); opacity: .65; transition: .2s; }
    .count-num { font-weight: 700; font-size: 1.15rem; color: var(--muted); }
    .count-btn.on { background: var(--ink); border-color: var(--ink); box-shadow: 0 8px 22px var(--soft); }
    .count-btn.on .count-num { color: #fff; }
    .count-btn.on .count-babies { filter: none; opacity: 1; }

    /* gender */
    .gender-stack { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .gender-row { display: flex; align-items: center; gap: 14px; }
    .child-dot { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700;
      font-size: .82rem; display: grid; place-items: center; box-shadow: 0 2px 6px var(--soft); }
    .gender-btn { width: 52px; height: 46px; border-radius: 13px; font-size: 1.4rem; line-height: 1; }
    .gender-btn.g-female.on { background: var(--c1); border-color: var(--c1); color: #fff; }
    .gender-btn.g-male.on   { background: var(--c2); border-color: var(--c2); color: #fff; }
    .gender-btn.g-neutral.on{ background: var(--c3); border-color: var(--c3); color: #fff; }
    .gender-btn.on { box-shadow: 0 6px 16px var(--soft); }

    /* length */
    .len-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
    .len-btn { aspect-ratio: 1; border: 1.5px solid var(--line); border-radius: 13px; background: var(--bg);
      color: var(--ink); font-weight: 600; font-size: 1rem; transition: .15s; }
    .len-btn:active { transform: scale(0.92); }
    .len-btn.on { background: var(--c3); border-color: var(--c3); color: #fff; box-shadow: 0 6px 16px var(--soft); transform: translateY(-1px); }
    .len-preview { display: flex; gap: 6px; justify-content: center; margin-top: 16px; height: 10px; }
    .len-prev-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c3); opacity: .55; }

    /* countries flag grid */
    .flag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 10px; }
    .flag-tile { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 16px; background: var(--bg);
      display: grid; place-items: center; transition: transform .15s, border-color .2s, box-shadow .2s, background .2s;
      filter: grayscale(0.85); opacity: .6; }
    .flag-big { font-size: 1.8rem; line-height: 1; }
    .flag-tile:hover { transform: translateY(-2px); }
    .flag-tile.on { filter: none; opacity: 1; border-color: var(--c2); background: var(--card);
      box-shadow: 0 8px 18px var(--soft); transform: translateY(-2px); }

    /* venn / universal */
    .venn-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px;
      padding-top: 16px; border-top: 1.5px dashed var(--line); transition: opacity .2s; }
    .venn-row.disabled { opacity: .4; }
    .venn { position: relative; display: grid; place-items: center; padding: 4px; border-radius: 12px; }
    .venn svg circle { fill: none; stroke: var(--muted); stroke-width: 2.5; transition: .25s; }
    .venn.on svg circle { stroke: var(--gold); }
    .venn.on svg circle:first-child { fill: color-mix(in srgb, var(--gold) 22%, transparent); }
    .venn.on svg circle:last-child  { fill: color-mix(in srgb, var(--gold) 22%, transparent); }
    .venn-star { position: absolute; font-size: .8rem; color: var(--gold); opacity: 0; transition: .25s; }
    .venn.on .venn-star { opacity: 1; }
    .venn-label { font-family: 'DM Mono', monospace; font-size: .62rem; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted); }

    /* discover */
    .discover { margin: 8px auto 0; display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 18px 44px; border-radius: 22px; background: var(--ink); color: #fff;
      box-shadow: 0 12px 30px var(--soft); transition: transform .15s, box-shadow .2s; }
    .discover:hover { transform: translateY(-2px); box-shadow: 0 16px 38px var(--soft); }
    .discover:active { transform: scale(0.97); }
    .disc-spark { color: var(--gold); font-size: 1.3rem; animation: twinkle 2.4s ease-in-out infinite; }
    .disc-babies { font-size: 1.5rem; }
    .disc-arrow { font-size: 1.4rem; font-weight: 700; }
    @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(1.25) rotate(20deg); opacity: .7; } }

    /* ── RESULTS ── */
    .results { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .cards-row { display: flex; align-items: stretch; justify-content: center; gap: 0; flex-wrap: nowrap; width: 100%; margin-top: 8px; }

    .card { flex: 1; max-width: 260px; min-width: 0; perspective: 1200px; }
    .card.flip .flip-inner { position: relative; width: 100%; min-height: 260px; transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(.2,.9,.3,1.2); transform: rotateY(180deg); }
    .card.flip .flip-inner.revealed { transform: rotateY(0deg); }
    .face { border-radius: 24px; }
    .card.flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      transition: opacity 0s linear .3s; }
    .card.flip .face-mystery { transform: rotateY(180deg); }
    /* opacity swap at the flip midpoint — robust even if 3D context flattens */
    .card.flip .flip-inner:not(.revealed) .face-name { opacity: 0; pointer-events: none; }
    .card.flip .flip-inner.revealed .face-mystery { opacity: 0; pointer-events: none; }

    .face-name { background: var(--card); border: 2px solid var(--line); padding: 26px 18px 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      box-shadow: 0 10px 30px var(--soft); position: relative; min-height: 260px;
      border-top: 5px solid var(--accent); }
    .is-locked .face-name { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), 0 10px 30px var(--soft); }

    .face-mystery { background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #fff));
      display: grid; place-items: center; min-height: 260px; box-shadow: 0 10px 30px var(--soft); }
    .mystery-glyph { font-size: 3rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,.18)); }
    .mystery-q { position: absolute; bottom: 22px; right: 26px; font-size: 1.6rem; font-weight: 700; color: rgba(255,255,255,.75); }

    .card-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin-bottom: 12px; }
    .card-name { font-weight: 600; font-size: clamp(1.5rem, 4.4vw, 2.1rem); color: var(--ink);
      line-height: 1.05; letter-spacing: -0.02em; word-break: normal; overflow-wrap: normal; hyphens: none; max-width: 100%; }
    .card-len { display: flex; gap: 4px; justify-content: center; margin-top: 12px; flex-wrap: wrap; max-width: 140px; }
    .len-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .5; }
    .card-foot { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
    .card-flags { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
    .card-flags .flag { font-size: 1.05rem; }
    .uni-badge { width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #fff;
      display: grid; place-items: center; font-size: .75rem; box-shadow: 0 2px 8px var(--soft); }

    .card-icon { position: absolute; top: 12px; width: 30px; height: 30px; border-radius: 50%;
      border: 1.5px solid var(--line); background: var(--card); font-size: .85rem; display: grid; place-items: center;
      transition: .15s; z-index: 2; }
    .card-icon:hover { border-color: var(--accent); transform: scale(1.1); }
    .card-icon.lock { left: 12px; }
    .card-icon.reroll { right: 12px; font-size: 1.05rem; color: var(--muted); }

    .card-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); }
    .empty-glyph { font-size: 2.2rem; opacity: .6; }
    .empty-dash { font-size: 2rem; }

    /* fly / none reveal */
    .card.fly .face-name, .card.none .face-name { opacity: 1; }
    .card.fly { opacity: 0; transform: translateY(16px) scale(.96); transition: opacity .45s, transform .45s cubic-bezier(.2,.9,.3,1.2); }
    .card.fly.in { opacity: 1; transform: none; }
    .card.fly:nth-child(odd) { transform: translateX(-24px) scale(.96); }
    .card.fly.in:nth-child(odd) { transform: none; }

    /* connector */
    .connector { flex: 0 0 auto; display: flex; flex-direction: row; align-items: center; justify-content: center;
      align-self: center; padding: 0 4px; }
    .conn-line { width: 16px; height: 2px; background: var(--line); }
    .conn-badge { width: 46px; height: 46px; border-radius: 50%; background: var(--card);
      border: 2px solid var(--line); display: grid; place-items: center; margin: 0 4px;
      box-shadow: 0 6px 16px var(--soft); flex: 0 0 auto; }
    .conn-glyph { font-size: 1.5rem; color: var(--ink); font-weight: 700; line-height: 1; }
    .conn-glyph.amp { font-family: 'Fredoka', serif; font-style: italic; color: var(--c2); }
    .conn-glyph:not(.amp) { color: var(--c1); }
    .connector.line-only .conn-line { width: 30px; }
    .connector.pulse .conn-badge { animation: connpulse 1.1s ease-in-out infinite; border-color: var(--gold); }
    @keyframes connpulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 45%, transparent); }
      50% { transform: scale(1.12); box-shadow: 0 0 0 10px transparent; } }

    /* action bar */
    .action-bar { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .act { width: 60px; height: 60px; border-radius: 20px; background: var(--card); border: 1.5px solid var(--line);
      font-size: 1.5rem; display: grid; place-items: center; box-shadow: 0 6px 18px var(--soft); transition: transform .15s, box-shadow .2s; }
    .act:hover { transform: translateY(-2px); }
    .act:active { transform: scale(0.93); }
    .act:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .act.dice { background: var(--ink); color: #fff; }
    .act.heart { color: var(--c1); font-size: 1.7rem; }
    .act.heart.saved { background: var(--c1); color: #fff; animation: pop 0.4s; }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
    .act.share { color: var(--c2); }
    .act.back { color: var(--muted); }

    /* shortlist tray */
    .tray { width: 100%; display: flex; align-items: center; gap: 12px; background: var(--soft);
      border: 1.5px dashed var(--line); border-radius: 18px; padding: 12px 14px; }
    .tray-head .heart-mini { color: var(--c1); font-size: 1.2rem; }
    .tray-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
    .tray-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; background: var(--card);
      border: 1.5px solid var(--line); border-radius: 13px; padding: 8px 10px 8px 12px; transition: .15s; }
    .tray-chip:hover { border-color: var(--c1); transform: translateY(-1px); }
    .tray-names { font-weight: 600; font-size: .95rem; white-space: nowrap; }
    .tray-amp, .share-amp { color: var(--muted); margin: 0 5px; font-style: italic; }
    .tray-x { color: var(--muted); font-size: .7rem; width: 18px; height: 18px; border-radius: 50%; }
    .tray-x:hover { background: var(--c1); color: #fff; }

    /* ── Share card overlay ── */
    .share-scrim { position: fixed; inset: 0; z-index: 50; background: rgba(20,16,30,.55);
      backdrop-filter: blur(6px); display: grid; place-items: center; padding: 22px; animation: fade .25s; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .share-stage { position: relative; animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes rise { from { transform: translateY(20px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
    .share-card { background: var(--card); border-radius: 28px; padding: 40px 36px 26px; text-align: center;
      box-shadow: 0 30px 70px rgba(20,16,30,.4); border: 2px solid var(--line);
      background-image: radial-gradient(360px 200px at 50% -10%, var(--blob1), transparent 70%); min-width: 300px; }
    .share-eyebrow { font-family: 'DM Mono', monospace; font-size: .62rem; letter-spacing: .25em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 22px; }
    .share-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; }
    .share-amp { font-size: 1.8rem; font-weight: 700; }
    .share-name-block { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 8px; }
    .share-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
    .share-name { font-weight: 600; font-size: clamp(2rem, 8vw, 3rem); color: var(--ink); line-height: 1; }
    .share-flags { font-size: 1rem; display: flex; gap: 3px; }
    .share-mark { margin-top: 26px; font-family: 'DM Mono', monospace; font-size: .6rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--muted); }
    .share-mark span { color: var(--c1); }
    .share-hint { text-align: center; margin-top: 16px; font-family: 'DM Mono', monospace; font-size: .62rem;
      letter-spacing: .14em; color: rgba(255,255,255,.85); }
    .share-close { position: absolute; top: -14px; right: -14px; width: 38px; height: 38px; border-radius: 50%;
      background: #fff; color: var(--ink); font-size: 1rem; box-shadow: 0 6px 16px rgba(0,0,0,.3); }

    /* ── Info sheet ── */
    .info-scrim { position: fixed; inset: 0; z-index: 55; background: rgba(20,16,30,.5); backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: flex-start; padding: 40px 18px; overflow-y: auto; animation: fade .25s; }
    .info-sheet { position: relative; width: 100%; max-width: 460px; background: var(--card); border: 2px solid var(--line);
      border-radius: 26px; padding: 30px 26px 24px; box-shadow: 0 30px 70px rgba(20,16,30,.4);
      background-image: radial-gradient(320px 180px at 100% -8%, var(--blob2), transparent 70%);
      animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
    .info-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%;
      border: 1.5px solid var(--line); background: var(--bg); color: var(--muted); font-size: .85rem; }
    .info-close:hover { color: var(--ink); border-color: var(--ink); }
    .info-eyebrow { font-family: 'DM Mono', monospace; font-size: .6rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--c2); margin: 4px 0 14px; }
    .how-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
    .how-step { display: flex; align-items: center; gap: 12px; }
    .how-num { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--c1); color: #fff;
      font-weight: 700; font-size: .78rem; display: grid; place-items: center; }
    .how-icon { flex: 0 0 auto; min-width: 52px; text-align: center; font-size: 1.05rem; letter-spacing: 2px; }
    .how-label { font-size: .98rem; color: var(--ink); }
    .src-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .src-row { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border: 1.5px solid var(--line);
      border-radius: 13px; background: var(--bg); text-decoration: none; transition: .15s; }
    .src-row:hover { border-color: var(--c2); transform: translateY(-1px); background: var(--card); }
    .src-flag { font-size: 1.2rem; }
    .src-country { flex: 1; font-size: .85rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .src-acro { font-family: 'DM Mono', monospace; font-size: .58rem; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
    .info-note { font-family: 'DM Mono', monospace; font-size: .58rem; line-height: 1.7; color: var(--muted); letter-spacing: .03em; }

    /* ── Discreet footer ── */
    .foot { margin-top: 36px; padding-top: 18px; border-top: 1.5px dashed var(--line); text-align: center;
      font-family: 'DM Mono', monospace; font-size: .56rem; letter-spacing: .12em; color: var(--muted); line-height: 2; }
    .foot a { color: var(--c1); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--c1) 35%, transparent); }
    .foot a:hover { border-bottom-color: var(--c1); }
    .foot-dot { margin: 0 8px; opacity: .6; }

    /* confetti */
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
    .confetti-wrap i { position: absolute; top: -20px; display: block; animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(620deg); opacity: .9; } }

    @media (max-width: 560px) {
